<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Slingo</title>
  <meta name="description" content="Slingo — a 2.5D slingshot betting game. Pull back, fire at the jumbo board, chase line bonuses." />
  <meta name="theme-color" content="#0d1026" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-left">
      <span id="logo">SLINGO</span>
      <span id="lastwin"></span>
    </div>
    <div class="hud-right">
      <span id="balance" class="pill">$0</span>
      <button id="topup" class="pill btn" type="button">+$100</button>
      <button id="mute" class="pill btn" type="button">🔊</button>
    </div>
  </div>
  <button id="refresh" class="btn" type="button" title="Refresh board">⟳</button>
  <div id="betbar">
    <span id="betlabel" class="pill">BET $1</span>
    <input id="betslider" type="range" min="1" max="100" step="1" value="1" aria-label="Bet amount" />
    <button id="shuffle" class="pill btn" type="button" title="Random bet per tile">🎲</button>
  </div>
  <div id="toast"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
