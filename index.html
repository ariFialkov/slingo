<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Slingo</title>
  <meta name="description" content="Slingo — slingshot pinball. Sling balls into the field, watch them bounce to their prize." />
  <meta name="theme-color" content="#0d1026" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-left">
      <span id="logo">SLINGO</span>
      <span id="lastwin"></span>
    </div>
    <div class="hud-right">
      <span id="inplay"></span>
      <span id="balance" class="pill">$0</span>
      <button id="topup" class="pill btn" type="button">+$500</button>
      <button id="mute" class="pill btn" type="button">🔊</button>
    </div>
  </div>
  <div id="betbar">
    <button id="balltype" class="pill btn" type="button" title="Change ball (bet)">
      <span id="balldot"></span>
      <span id="ballname">BRONZE · $1.00</span>
      <span class="chev">▸</span>
    </button>
  </div>
  <div id="toast"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
