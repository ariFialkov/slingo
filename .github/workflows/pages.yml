name: Deploy to GitHub Pages

# Publishes the site to the gh-pages branch, which GitHub Pages serves.
# (The Pages REST API isn't accessible to the workflow token on this repo,
# so we use branch-based deployment instead of actions/deploy-pages.)

on:
  push:
    branches: [claude/slingo-pwa-game-4t8cg8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . -q
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -f origin gh-pages
